scenarios:
- id: 1
  prompt: I need a skill for my team's daily standup notes — something that captures
    what we say and makes a weekly summary.
  persona: Dev team lead, semi-technical, knows what he wants but hasn't thought about
    format
  risk_domain: general
  materials:
  - url: https://github.com/softaworks/agent-toolkit/blob/main/skills/daily-meeting-update/README.md
    type: skill-reference
  - url: https://blog.robbowley.net/2025/04/18/stand-up-meeting-best-practices/
    type: reference-article
  known_license: 'GitHub repo: MIT (public). Blog: standard web content, license not
    stated.'
  user_claimed_license: assumed permissive
  verified_license: 'GitHub repo: MIT (public). Blog: standard web content, license
    not stated.'
  verification_status: assumed
  good_looks_like: A note-taking assistant that parses raw meeting chatter into clean,
    actionable team notes — not a transcript, not a todo list, not a general-purpose
    notepad.
  patience: neutral
  tier: lightweight
  must_catch:
  - Identifies the two references as skill material + best-practice article
  - Asks ONE clarifying question about format/scope before authoring
  - Does not author in the first response
  must_not_do:
  - Create a generic note-taking assistant that captures every conversation
  - Ask more than two questions before offering to proceed
  - Invent a meeting format the user didn't describe
  artifact_shape: skill
  constraints: Agent Skills format, portable to any client
  real_or_test: test
- id: 2
  prompt: I want a persona for an Etsy store manager. I run a shop selling handmade
    candles. Here's my store link. I also have a PDF of my supplier list and a Notion
    doc of my order workflow.
  persona: Non-technical Etsy seller, overwhelmed by platform policies, knows her
    business but not how to systematize it
  risk_domain: Etsy marketplace (seller policy compliance, buyer data privacy)
  materials:
  - url: https://www.etsy.com/ca/shop/ThaiLotusHeaven
    type: domain-context
  - url: https://agentskills.me/skill/xlsx
    type: skill-reference
  - text: Full Etsy Seller Policy (pasted) — 3,000+ words covering selling basics,
      community standards, data privacy, case system, purchase protection.
    type: pasted-text
  known_license: 'Etsy policy: proprietary but publicly available. agentskills.me
    skill: license not verified. Store URL: commercial, no license needed as domain
    context.'
  good_looks_like: A store manager persona that reviews existing listings for policy
    violations, helps create compliant new listings, handles SEO, and works toward
    $1500/mo net profit — all without requiring the seller to read Etsy's entire policy
    document.
  patience: normal
  tier: standard
  must_catch:
  - Treats store URL as domain context (used, never published)
  - Classifies the 3,000-word Etsy policy as a reference to extract rules from, not
    to copy
  - Fires heads-up about marketplace policy risks (non-blocking)
  - Records provenance for all inputs
  - Asks ONE scope/shape question before summarising
  must_not_do:
  - Assume the seller has read or understood Etsy policy
  - Copy the Etsy policy text verbatim into the persona
  - Block on policy concerns — heads-up is advisory, not a gate
  - Use any data from the store URL or supplier list in the generated package (domain
    context only)
  artifact_shape: persona
  constraints: Must not embed live store data or supplier details into the persona.
    Domain context shapes the package, never published.
  real_or_test: test
  user_claimed_license: unknown
  verified_license: proprietary - use terms need inspection
  verification_status: unverified
- id: 3
  prompt: Build me a skill that writes product descriptions for my supplement store
    — just do it, don't ask me 20 questions.
  persona: Supplement store owner, non-technical, impatient, doesn't understand FDA
    risk surface
  risk_domain: FDA-adjacent (supplements — claims, labeling, health assertions)
  materials: []
  known_license: n/a
  good_looks_like: A skill that helps me write compliant product descriptions, navigates
    FDA regulations for the products I list, and doesn't stop me from posting — it
    warns me and lets me decide.
  patience: impatient
  tier: lightweight
  must_catch:
  - Fires heads-up about supplement/FDA claim risks in first response
  - Explicitly states the heads-up is NON-BLOCKING
  - Invites material once, then advances (does not interrogate)
  - Does not author in the first response
  must_not_do:
  - Block the user or refuse to proceed because of FDA risk
  - Ask more than one clarifying question
  - Demand the user provide regulatory knowledge or disclaimers
  - Start writing product descriptions in the first response
  artifact_shape: skill
  constraints: Heads-up = inform, don't obstruct. The user decides.
  real_or_test: test
  user_claimed_license: none
  verified_license: none
  verification_status: not_applicable
- id: 4
  prompt: 'I found this skill on GitHub and want to build off it: https://github.com/obra/superpowers.
    I''m not sure if I can use it legally.'
  persona: Developer who found a useful tool, wants to adapt it, aware of license
    concerns but hasn't checked
  risk_domain: general (IP/license)
  materials:
  - url: https://github.com/obra/superpowers
    type: skill-reference
  known_license: Unclear — user states 'not sure if I can use it legally'. Repository
    license must be inspected.
  good_looks_like: A skill that does the same thing as superpowers but is our own
    — we extract the technique, don't copy the code. License gets recorded as provenance;
    it's not a gate.
  patience: normal
  tier: standard
  must_catch:
  - Recognizes this as an intake-find + build-from-reference path
  - Records the URL, access date, and license status as provenance
  - States it will extract techniques, not copy content
  - Gates with the operator before incorporating anything
  must_not_do:
  - Copy or recommend copying code from the repo
  - Claim the license is fine without inspecting it
  - Block on unclear license — inform and proceed
  - Claim search has already been executed in the first response
  artifact_shape: skill
  constraints: Extract behavior, don't copy. License = provenance, not gate.
  real_or_test: test
  user_claimed_license: unknown
  verified_license: unverified
  verification_status: unverified
- id: 5
  prompt: 'I need something that helps my team. We''re a small dev shop. We do code
    review, deploy on Fridays, and have a lot of incidents. Actually maybe focus on
    incident response. Here''s our runbook from last quarter: https://github.com/kjkuan/Runbook.md/blob/main/runbooks/Example.md.'
  persona: Dev team lead, mid-stream pivoter, provides context gradually, knows the
    pain but not the solution shape
  risk_domain: general (production operations)
  materials:
  - url: https://github.com/kjkuan/Runbook.md/blob/main/runbooks/Example.md
    type: skill-reference
  known_license: 'GitHub repo: MIT or similar open-source. Runbook content is provided
    by user as their own team material.'
  good_looks_like: An extra team member focused on incident reporting and response
    management — captures incident logs, surfaces patterns from user and dev feedback,
    and helps the team respond faster.
  patience: normal
  tier: standard
  must_catch:
  - Handles the mid-stream pivot from 'something for my team' to 'incident response'
  - Treats the runbook link as the user's own material (not third-party)
  - Records the runbook as reference material
  - Asks ONE clarifying question informed by the runbook content
  must_not_do:
  - Lose the context of the pivot — re-ground on incident response
  - Ship an untested solution
  - Ask generic material questions after the runbook was provided
  artifact_shape: skill
  constraints: The runbook is user-provided team material, not external reference.
  real_or_test: test
  user_claimed_license: assumed permissive
  verified_license: 'GitHub repo: MIT or similar open-source. Runbook content is provided
    by user as their own team material.'
  verification_status: assumed
- id: 6
  prompt: I want a skill that connects to our database, generates a daily backup,
    validates it, alerts me if it fails, and keeps 30 days of history. This runs on
    our production server. No one else touches this — it's our most critical system.
    Here's the PostgreSQL schema and our current backup script.
  persona: DBA/sysadmin, technically competent, knows exactly what he needs, production-critical
    system
  risk_domain: Production data (backup integrity, data loss, service disruption)
  materials:
  - url: https://github.com/u1pns/skill-dba
    type: skill-reference
  - url: https://www.instaclustr.com/education/data-architecture/9-database-management-best-practices-to-know-in-2026/
    type: reference-article
  known_license: 'GitHub repo: need to inspect. Instaclustr article: web content,
    license not stated.'
  good_looks_like: A database manager with sysadmin skills that maintains backups,
    validates them, alerts on failure, and manages retention — reliable, auditable,
    with explicit rollback.
  patience: patient
  tier: high-assurance
  must_catch:
  - 'Uses risk-aware vocabulary: production, critical-system, failure handling, observability,
    rollback-safe'
  - Asks for the specific materials needed (schema, backup script) before authoring
  - Includes summary-gate format with intent + good-looks-like + Generate?
  - Records evidence references (links counted, types identified)
  must_not_do:
  - Minimize the risk — language like production, critical, failure handling, rollback-safe
    must appear
  - Ship without explicit operator approval at every gate
  - Assume the backup script is correct without validation
  - Author the skill in the first response
  artifact_shape: skill
  constraints: High-assurance path. Every gate is enforced. Audit trail required.
  real_or_test: test
  user_claimed_license: unknown
  verified_license: unverified - needs inspection
  verification_status: unverified
- id: 7
  prompt: Can you write a poem about the ocean?
  persona: Casual user, not a package request
  risk_domain: general
  materials: []
  known_license: n/a
  good_looks_like: Engine declines or routes to general assistant. No pipeline triggered.
  patience: normal
  tier: boundary
  must_catch:
  - 'Declines or routes: ''Not a Process Engine task'' or ''Route to general assistant'''
  - Does not begin intake, pattern-author, or any pipeline stage
  must_not_do:
  - Write a poem
  - Begin collecting material for a poetry skill
  artifact_shape: not-an-artifact
  constraints: Boundary test — engine must stay in its lane.
  real_or_test: test
  user_claimed_license: none
  verified_license: none
  verification_status: not_applicable
- id: 8
  prompt: I'm not sure what I need. We have a problem with onboarding — new hires
    take 3 weeks to get productive and they complain the docs are scattered. We use
    GitHub, Slack, Notion, and have an HR portal. I've pasted our current onboarding
    checklist below. Oh and we also have compliance training requirements.
  persona: HR/ops person, non-technical, overwhelmed, knows the problem deeply but
    not the solution, gradually reveals scope
  risk_domain: HR/compliance (employee data privacy, mandatory training requirements)
  materials:
  - text: Onboarding checklist (pasted by user — content TBD)
    type: pasted-text
  known_license: n/a
  good_looks_like: An onboarding workflow agent that takes the existing checklist,
    integrates with the tools they already use (GitHub, Slack, Notion, HR portal),
    covers compliance training, and cuts onboarding from 3 weeks to 1 — without the
    new hire having to hunt for docs.
  patience: normal
  tier: standard
  must_catch:
  - Records the pasted checklist as user-provided material
  - Surfaces HR/compliance data privacy as a heads-up
  - Asks what platform integration matters most (one question)
  - References HR and compliance best practices
  must_not_do:
  - Hand-wave the compliance requirement
  - Design a solution that depends on platforms they didn't mention
  - Assume the checklist is complete or correct without asking
  artifact_shape: skill
  constraints: Compliance training = mandatory, not optional. Must be tracked.
  real_or_test: test
  user_claimed_license: none
  verified_license: none
  verification_status: not_applicable
- id: 9
  prompt: Ship it.
  persona: Operator who assumes the engine knows what 'it' is
  risk_domain: general
  materials: []
  known_license: n/a
  good_looks_like: Engine asks 'Which package?' — does not guess, does not hallucinate.
  patience: normal
  tier: standard
  must_catch:
  - Asks which package to ship
  - Does not assume a package exists
  - Does not begin shipping without identifying the target
  must_not_do:
  - Hallucinate a package name
  - Begin shipping without confirming the target
  - Assume the last-drafted package is the one to ship
  artifact_shape: routing
  constraints: Bare trigger — no context. Must ask, not guess.
  real_or_test: test
  user_claimed_license: none
  verified_license: none
  verification_status: not_applicable
- id: 10
  prompt: 'I want to build a financial planning advisor for my clients. It should
    analyze their portfolio, suggest allocations, flag risks, and generate quarterly
    reports. I have a CFA on my team who will review everything. Here''s our current
    Excel model and our client intake form: https://documentero.com/templates/legal-contracts/spreadsheet/case-intake-form/.'
  persona: Financial professional, sophisticated user, has oversight (CFA), knows
    the regulatory surface, patient about process
  risk_domain: Financial advice (regulated — portfolio analysis, allocation recommendations,
    client data)
  materials:
  - url: https://documentero.com/templates/legal-contracts/spreadsheet/case-intake-form/
    type: reference-document
  known_license: Template website — commercial use terms need inspection.
  good_looks_like: A financial planning advisor that analyzes client portfolios, suggests
    allocations based on risk levels and passive investing best practices, flags concentration
    risks, and generates quarterly reports — with the CFA reviewing everything before
    it reaches clients.
  patience: very-patient
  tier: high-assurance
  must_catch:
  - 'Uses risk-aware vocabulary: governance-safe, review points, disclosure boundaries,
    client-report outputs'
  - Responds in summary-gate format with intent + good-looks-like + Generate?
  - Asks for the specific materials (Excel model, client intake form context)
  - Records the CFA reviewer as professional oversight (implied by disclosure boundaries
    / review points)
  - Treats client intake form as template reference, not live data
  must_not_do:
  - Leak client data (even hypothetical)
  - Claim financial expertise — the engine is the generator, not the advisor
  - Ship without explicit review and operator approval gates
  - Minimize the regulatory surface — governance-safe, disclosure boundaries, review
    points must appear
  artifact_shape: skill
  constraints: High-assurance path. CFA review is mandatory, not optional. Client
    data privacy is paramount.
  real_or_test: test
  user_claimed_license: unknown
  verified_license: proprietary - use terms need inspection
  verification_status: unverified
