name: release-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (pinned SHA)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 (pinned SHA)
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit tests (hard gate)
        run: python -m unittest discover -s methodfactory/tests -t .

      - name: Identity sweep — stale identity in active zones
        run: |
          # Zero-tolerance zones (ADR-0009/0010): code and active prompts must
          # never carry Process Engine identity. evidence/ is the explicit
          # quarantine and is never part of this scope.
          if grep -rInEi 'process engine|process-engine|v1\.9\.1|lineage v7\.2' \
              methodfactory/ prompts/; then
            echo "::error::stale identity in active zone (methodfactory/ or prompts/)"
            exit 1
          fi

      - name: Identity sweep — quarantine-path references in active docs
        run: |
          # Active narrative docs may reference quarantined artifacts ONLY as
          # narrow pointers (evidence/process-engine/ or the migration
          # narrative). ADRs are exempt: their migration context is their
          # subject matter (ADR-0009). CHANGELOG pre-2.0.0 is preserved
          # history. The migration doc (docs/migration-from-process-engine.md)
          # is the designated narrow pointer and lists every quarantined name
          # by design. Generic path names (scripts/, skills/) are not matched —
          # only unambiguous quarantined artifact names. Case-insensitive.
          QUARANTINED='(process-engine\.toml|package-manifest-schema|provenance-schema|evaluator-freeze-policy|governance-usage|spec-compliance)'
          FAIL=0
          for f in docs/action-envelope.md docs/architecture.md \
                   docs/manifest-contract-v0.1.md README.md CONTRIBUTING.md; do
            [ -f "$f" ] || continue
            matches=$(grep -niE "$QUARANTINED" "$f" | grep -vE 'evidence/process-engine' || true)
            if [ -n "$matches" ]; then
              echo "::error::quarantined artifact referenced without pointer in $f"
              echo "$matches"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Determinism — no stray generated output (ADR-0002/0010)
        run: |
          # No generator exists in v2.0.0; a derived-output directory in the
          # tree means generated content was committed without a regeneration
          # command. Restore the regenerate->diff-empty gate when a generator
          # lands (ADR-0002 amendment). .mf/ is the CLI's runtime store and is
          # operator data — it must never be committed.
          if [ -d workspace ] || ls -d iteration-* >/dev/null 2>&1 || [ -d .mf ]; then
            echo "::error::stray generated output or runtime store present (workspace/, iteration-*/, .mf/)"
            exit 1
          fi

      - name: Packaging sanity — mf entry point
        run: |
          pip install -e .
          python -m methodfactory.cli --version
          mf --version
