name: release-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (pinned SHA)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 (pinned SHA)
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install with test extras
        run: pip install -e ".[test]"

      - name: Unit tests (canonical gate)
        run: python -m unittest discover -s methodfactory/tests -t .

      - name: Packaging smoke — mf entry point
        run: |
          mf --version
          python -m methodfactory --version

      - name: No runtime/build artifacts in worktree
        run: |
          test ! -d .mf || { echo "::error::unexpected .mf/ store in tree"; exit 1; }
          test -z "$(git status --porcelain)" || { echo "::error::dirty worktree"; git status --porcelain; exit 1; }
